spring:
  application:
    name: sentinelvoice-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:sentinelvoice;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.sentinelvoice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [cid=%X{cid:-}] [%15.15t] %-40.40logger{39} : %m%n"

# Values from Context ┬º9.1 (fusion weights / EMA / family thresholds) and ┬º9.5 (intervention hysteresis).
sentinelvoice:
  fusion:
    weights:
      wideband:
        voice: 0.24
        channel: 0.08
        prosody: 0.13
        linguistic: 0.25
        transaction: 0.18
        relationship: 0.12
      narrowband:
        voice: 0.15
        channel: 0.10
        prosody: 0.12
        linguistic: 0.29
        transaction: 0.20
        relationship: 0.14
    lambda-up: 0.55
    lambda-down: 0.88
    family-thresholds:
      voice: 0.60
      channel: 0.55
      prosody: 0.60
      linguistic: 0.65
      transaction: 0.60
      relationship: 0.60
    linguistic-staleness-tau-ms: 3000
    min-speech-ms-for-scoring: 3000
    emergency:
      # Context ┬º9.4 ΓÇö emergency bypass thresholds
      cosine-mismatch-threshold: 0.50
      secrecy-threshold: 0.85
      authority-threshold: 0.85
      transaction-score-threshold: 0.80
  intervention:
    l1-to-l2:
      up-threshold: 0.35
      down-threshold: 0.28
      dwell-ms: 1000
    l2-to-l1:
      up-threshold: 0.35
      down-threshold: 0.28
      dwell-ms: 5000
    l2-to-l3:
      up-threshold: 0.55
      down-threshold: 0.46
      dwell-ms: 1000
    l3-to-l2:
      up-threshold: 0.55
      down-threshold: 0.46
      dwell-ms: 8000
    l3-to-l4:
      up-threshold: 0.75
      down-threshold: 0.66
      dwell-ms: 1000
    l4-to-l3:
      up-threshold: 0.75
      down-threshold: 0.66
      dwell-ms: 15000
    l4-to-l5:
      up-threshold: 0.90
      down-threshold: 0.90
      dwell-ms: 0
    # How long a manual override pins the level (automatic transitions suppressed)
    override-pin-duration-ms: 120000
  ml:
    base-url: http://localhost:8000
    websocket-url: ws://localhost:8000/ingest
    connect-timeout-ms: 2000
    frame-staleness-ms: 1500
  session:
    ttl-minutes: 30
    max-concurrent: 100
  audit:
    genesis-prefix: SENTINELVOICE-GENESIS-v1
  identity:
    # Internal PBX extensions (3ΓÇô5 digits) or ext-NNNN
    internal-extension-pattern: "^(ext-)?\\d{3,5}$"
    registered-external-clis:
      - "+91-22-6655-0001"
      - "+91-22-6655-0100"
      - "+91-22-6655-0003"
      - "+91-22-6655-0004"
      - "+91-22-6655-2010"
      - "+91-22-6655-2011"
      - "+91-22-6655-3020"
      - "+91-22-6655-3021"
      - "+91-22-6655-4030"
      - "+91-22-6655-4031"
      - "+91-22-6655-5040"
      - "+91-22-6655-5041"
      - "+91-22-6655-5042"
      - "+91-22-6655-6050"
      - "+91-22-6655-6051"
    cosine-match-min: 0.70
    cosine-mismatch-max: 0.50
    spoof-high-threshold: 0.60
  context:
    relationship:
      # S_graph = w_fc*I_fc + w_hier*min(1, dist/norm) + w_off*I_off + w_dur*I_dur
      # S_relationship = clamp01(S_graph + weightCrossChannel * S_cross)  — not a 7th family
      weight-first-contact: 0.60
      weight-hierarchy: 0.35
      weight-off-hours: 0.05
      weight-duration-anomaly: 0.05
      weight-cross-channel: 0.40
      hierarchy-normalize-levels: 6
      business-hour-start: 9
      business-hour-end: 18
      typical-hour-deviation-hours: 4
      duration-anomaly-ratio: 2.0
    cross-channel:
      window-hours: 48
      matching-campaign-boost: 0.35
      indicator-match-boost: 0.15
      multi-channel-boost: 0.10
    transaction:
      # Policy breach is deterministic ΓÇö near 1.0, not a soft suspicion.
      policy-violation-score: 0.98
      weight-channel-denied: 0.25
      weight-beneficiary-novel: 0.20
      weight-velocity: 0.15
      # Multiplicative urgency├ùamount term (see TransactionPolicyService).
      weight-urgency-amount-product: 0.40
      high-value-threshold-inr: 100000
      large-amount-threshold-inr: 5000000
      velocity-high-value-limit: 3
      known-beneficiary-hints:
        - "vendor account ending 8821"
        - "payroll suspense 1001"
        - "rbi settlement pool"
  actuation:
    # noop | webrtc | asterisk  ΓÇö lab default is noop so unit tests need no Asterisk.
    adapter: noop
    ari:
      base-url: http://127.0.0.1:8088/ari
      username: sentinel
      password: sentineldemo
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    # In-process MOCK CBS freeze sink (see MockCbsController).
    cbs-freeze-url: http://127.0.0.1:${server.port:8080}/mock-cbs/freeze
    supervisor-endpoint: PJSIP/agent
  compliance:
    telemetry-ttl-days: 90
    audit-retention-years: 7
    purge-interval-hours: 24
    purge-interval-ms: 86400000
    # P12 harness writes here; portal shows "evaluation not yet run" if missing.
    fairness-results-path: ../benchmarks/results.json
    raw-audio-enforcing-path: ml-engine/app/ring_buffer.py
