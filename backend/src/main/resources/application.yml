spring:
  application:
    name: sentinelvoice-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:sentinelvoice;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

sentinelvoice:
  risk:
    default-window-seconds: 5
    intervention-thresholds:
      soft-nudge: 0.35
      mfa: 0.55
      auto-hold: 0.75
      terminate: 0.9
