spring:
  application:
    name: sentinelvoice-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime pool uses sv_app (no BYPASSRLS, cannot ALTER). See docs/v2/features/F1.md.
    # options=TimeZone=UTC avoids FATAL when the host JVM zone is obsolete (e.g. Asia/Calcutta).
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/sentinelvoice?options=-c%20TimeZone%3DUTC}
    username: ${DB_APP_USER:sv_app}
    password: ${DB_APP_PASSWORD:changeme_app}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # Migrations run as sv_owner so RLS (F3) cannot be bypassed by the app role.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/sentinelvoice?options=-c%20TimeZone%3DUTC}
    user: ${DB_OWNER_USER:sv_owner}
    password: ${DB_OWNER_PASSWORD:changeme_owner}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 18MB

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.sentinelvoice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [cid=%X{cid:-}] [%15.15t] %-40.40logger{39} : %m%n"

# Values from Context (fusion weights / EMA / family thresholds) and intervention hysteresis.
sentinelvoice:
  auth:
    # Fail-fast if missing / short — set JWT_SECRET in env (see .env.example).
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-domain: ${COOKIE_DOMAIN:}
    cors-origins: ${SENTINELVOICE_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  fusion:
    weights:
      wideband:
        voice: 0.24
        channel: 0.08
        prosody: 0.13
        linguistic: 0.25
        transaction: 0.18
        relationship: 0.12
      narrowband:
        voice: 0.15
        channel: 0.10
        prosody: 0.12
        linguistic: 0.29
        transaction: 0.20
        relationship: 0.14
    lambda-up: 0.55
    lambda-down: 0.88
    family-thresholds:
      voice: 0.60
      channel: 0.55
      prosody: 0.60
      linguistic: 0.65
      transaction: 0.60
      relationship: 0.60
    linguistic-staleness-tau-ms: 3000
    min-speech-ms-for-scoring: 3000
    emergency:
      # Context ┬º9.4 ΓÇö emergency bypass thresholds
      cosine-mismatch-threshold: 0.50
      secrecy-threshold: 0.85
      authority-threshold: 0.85
      transaction-score-threshold: 0.80
  intervention:
    l1-to-l2:
      up-threshold: 0.35
      down-threshold: 0.28
      dwell-ms: 1000
    l2-to-l1:
      up-threshold: 0.35
      down-threshold: 0.28
      dwell-ms: 5000
    l2-to-l3:
      up-threshold: 0.55
      down-threshold: 0.46
      dwell-ms: 1000
    l3-to-l2:
      up-threshold: 0.55
      down-threshold: 0.46
      dwell-ms: 8000
    l3-to-l4:
      # Design target 0.75; lab WAV placeholders + seeds settle ~0.74 — allow L4 at 0.73.
      up-threshold: 0.73
      down-threshold: 0.66
      dwell-ms: 1000
    l4-to-l3:
      up-threshold: 0.75
      down-threshold: 0.66
      dwell-ms: 15000
    l4-to-l5:
      up-threshold: 0.90
      down-threshold: 0.90
      dwell-ms: 0
    # How long a manual override pins the level (automatic transitions suppressed)
    override-pin-duration-ms: 120000
  ml:
    base-url: http://localhost:8000
    websocket-url: ws://localhost:8000/ingest
    connect-timeout-ms: 2000
    # Lab SIP path: rebase on backlog (see FeatureFrameIngestService); keep generous.
    frame-staleness-ms: 60000
  ml-service:
    # Shared secret for ml-engine → Java /ws/features (F3)
    service-token: ${ML_SERVICE_TOKEN:}
  llm-gateway:
    # F5 — Inference-plane FastAPI router (not the 500ms feature-frame loop)
    base-url: ${LLM_GATEWAY_URL:http://127.0.0.1:8000}
    service-token: ${ML_SERVICE_TOKEN:}
    connect-timeout-ms: 2000
    # policy_compile budget is 90s; leave headroom for gateway + repair retry
    read-timeout-ms: 120000
  policy-compile:
    max-documents-per-compile: 5
  challenge:
    human-latency-ms: 1800
    suspicious-latency-ms: 3500
    expiry-ms: 15000
    content-overlap-min: 0.60
    acoustic-cosine-min: 0.55
    speech-capture-ms: 3000
  session:
    ttl-minutes: 30
    max-concurrent: 100
  audit:
    genesis-prefix: SENTINELVOICE-GENESIS-v1
  identity:
    # Legacy trunk patterns retained for config compat; F4 resolve uses directory phones/extensions.
    internal-extension-pattern: "^(ext-)?\\d{3,5}$"
    registered-external-clis:
      - "+91-22-6655-0001"
      - "+91-22-6655-0100"
      - "+91-22-6655-0003"
      - "+91-22-6655-0004"
      - "+91-22-6655-2010"
      - "+91-22-6655-2011"
      - "+91-22-6655-3020"
      - "+91-22-6655-3021"
      - "+91-22-6655-4030"
      - "+91-22-6655-4031"
      - "+91-22-6655-5040"
      - "+91-22-6655-5041"
      - "+91-22-6655-5042"
      - "+91-22-6655-6050"
      - "+91-22-6655-6051"
    cosine-match-min: 0.70
  directory:
    hmac-secret: ${DIRECTORY_HMAC_SECRET:}
    status-revert-ms: 60000
    cosine-mismatch-max: 0.50
    spoof-high-threshold: 0.60
  context:
    relationship:
      # S_graph = w_fc*I_fc + w_hier*min(1, dist/norm) + w_off*I_off + w_dur*I_dur
      # S_relationship = clamp01(S_graph + weightCrossChannel * S_cross)  — not a 7th family
      weight-first-contact: 0.60
      weight-hierarchy: 0.35
      weight-off-hours: 0.05
      weight-duration-anomaly: 0.05
      weight-cross-channel: 0.40
      hierarchy-normalize-levels: 6
      business-hour-start: 9
      business-hour-end: 18
      typical-hour-deviation-hours: 4
      duration-anomaly-ratio: 2.0
    cross-channel:
      window-hours: 48
      matching-campaign-boost: 0.35
      indicator-match-boost: 0.15
      multi-channel-boost: 0.10
  actuation:
    # noop | webrtc | asterisk — lab default noop; use asterisk for live SIP hold/whisper.
    adapter: asterisk
    ari:
      base-url: http://127.0.0.1:8088/ari
      username: sentinel
      password: sentineldemo
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    # In-process MOCK CBS freeze sink (see MockCbsController).
    cbs-freeze-url: http://127.0.0.1:${server.port:8081}/mock-cbs/freeze
    supervisor-endpoint: PJSIP/agent
  compliance:
    telemetry-ttl-days: 90
    audit-retention-years: 7
    purge-interval-hours: 24
    purge-interval-ms: 86400000
    # P12 harness writes here; portal shows "evaluation not yet run" if missing.
    fairness-results-path: ../ml-engine/benchmarks/results.json
    raw-audio-enforcing-path: ml-engine/app/ring_buffer.py

# AuthZ lab users are registered in SecurityConfig (password: password).
# Do not put bcrypt hashes with bare $ under sentinelvoice.* — Spring treats $ as placeholders
# and can wipe constructor binding for the whole prefix. Optional overrides:
sv:
  security:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      llmGateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
