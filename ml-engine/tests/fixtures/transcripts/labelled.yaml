# Labelled transcript fixtures for P10.2 intent tests.
# label: fraudulent | benign
# expect_fired: categories that must fire (score >= threshold)
# expect_low: categories that must stay below the given ceiling

- id: fraud_en_cfo_wire
  label: fraudulent
  lang: en
  text: >
    This is the CFO. Transfer fifty lakhs to the vendor account immediately.
    Don't tell your manager — verbal approval only. Keep this between us.
  expect_fired: [urgency, secrecy, authority]
  expect_ask_amount: 5000000

