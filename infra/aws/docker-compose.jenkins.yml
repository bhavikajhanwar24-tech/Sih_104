# Jenkins controller only. The app stack is docker-compose.aws.yml at the repo root.
# This container is root so it can use the host Docker socket for builds.

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: sentinelvoice-jenkins
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx320m -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /opt/sentinelvoice/infra/aws/jenkins/casc.yaml
    env_file:
      - /opt/sentinelvoice-secrets/jenkins.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/sentinelvoice:/opt/sentinelvoice
      - /opt/sentinelvoice-secrets:/opt/sentinelvoice-secrets:ro
    mem_limit: 640m
    entrypoint: ["/bin/bash", "/opt/sentinelvoice/infra/aws/jenkins/entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jenkins_home:
