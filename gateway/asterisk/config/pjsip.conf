; =============================================================================
; SentinelVoice lab PJSIP — DEMO CREDENTIALS ONLY (Context §11.3 / P7.1)
; Passwords are intentionally obvious. This is an offline softphone lab, NOT
; a production PBX. Do not expose port 5060 to the public internet.
; =============================================================================

[global]
type=global
endpoint_identifier_order=ip,username,anonymous

; ---- UDP transport on 5060 ---------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Docker Desktop: advertise the host so softphones can send RTP back.
; On Linux host-network demos you can blank these two lines.
external_media_address=host.docker.internal
external_signaling_address=host.docker.internal
local_net=127.0.0.1/32
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ---- Extension 1001 / softphone identity "caller" ----------------------------
[caller]
type=endpoint
context=sentinel
disallow=all
allow=ulaw,alaw,slin16
auth=caller-auth
aors=caller
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
media_use_received_transport=yes

[caller-auth]
type=auth
auth_type=userpass
username=caller
; DEMO PASSWORD — lab only
password=callerdemo1001

[caller]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---- Extension 1002 / softphone identity "agent" -----------------------------
[agent]
type=endpoint
context=sentinel
disallow=all
allow=ulaw,alaw,slin16
auth=agent-auth
aors=agent
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
media_use_received_transport=yes

[agent-auth]
type=auth
auth_type=userpass
username=agent
; DEMO PASSWORD — lab only
password=agentdemo1002

[agent]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
