; =============================================================================
; SentinelVoice lab PJSIP — DEMO CREDENTIALS ONLY (Context §11.3 / P7.1)
; Passwords are intentionally obvious. This is an offline softphone lab, NOT
; a production PBX. Do not expose port 5060 to the public internet.
; =============================================================================

[global]
type=global
endpoint_identifier_order=ip,username,anonymous

; ---- UDP transport on 5060 ---------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Docker Desktop (Win/Mac): softphones on the host register via the bridge
; gateway (172.18.0.1). If that range is in local_net, Asterisk puts the
; container IP (172.18.x.x) in SDP — softphones cannot RTP there → silent call.
; Softphones on laptop + phone (same Wi‑Fi): advertise the Windows LAN IP so
; the phone can reach RTP. Do NOT use 127.0.0.1 here — that breaks Android.
; Change this if your Wi‑Fi IP changes (ipconfig → Wi‑Fi IPv4).
external_media_address=192.168.1.8
external_signaling_address=192.168.1.8
; Do NOT list 172.16.0.0/12 or 192.168.0.0/16 — Docker bridge / LAN clients
; must receive the external_* address in SDP, not the container IP.
local_net=127.0.0.1/32

; ---- Extension 1001 / softphone identity "caller" ----------------------------
[caller]
type=endpoint
context=sentinel
disallow=all
allow=ulaw
auth=caller-auth
aors=caller
transport=transport-udp
; Force SDP c= line (Docker SNAT makes peers look like 172.18.0.1, so
; transport external_* is skipped and Asterisk would advertise 172.18.0.2).
media_address=192.168.1.8
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
media_use_received_transport=yes
media_encryption=no
inband_progress=no

[caller-auth]
type=auth
auth_type=userpass
username=caller
; DEMO PASSWORD — lab only
password=callerdemo1001

[caller]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---- Extension 1002 / softphone identity "agent" -----------------------------
[agent]
type=endpoint
context=sentinel
disallow=all
allow=ulaw
auth=agent-auth
aors=agent
transport=transport-udp
media_address=192.168.1.8
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
media_use_received_transport=yes
media_encryption=no
inband_progress=no

[agent-auth]
type=auth
auth_type=userpass
username=agent
; DEMO PASSWORD — lab only
password=agentdemo1002

[agent]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
