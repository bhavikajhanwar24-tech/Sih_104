; =============================================================================
; SentinelVoice PJSIP — transport + global ONLY (F10)
; Endpoints live in PostgreSQL PJSIP REALTIME (schema asterisk.ps_*).
; Placeholders __SIP_EXTERNAL_IP__ / __SIP_LOCAL_NET__ are envsubst'd by
; docker-entrypoint-sentinel.sh from SIP_EXTERNAL_IP / SIP_LOCAL_NET.
; =============================================================================

[global]
type=global
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__SIP_EXTERNAL_IP__
external_signaling_address=__SIP_EXTERNAL_IP__
; Do NOT list Docker bridge or broad LAN ranges — clients must receive external_*.
local_net=__SIP_LOCAL_NET__
