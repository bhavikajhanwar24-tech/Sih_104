; SentinelVoice ConfBridge profiles (Asterisk 20 ACO — no end_conference_on_exit).
[general]

[sv_user]
type=user
dtmf_passthrough=yes
announce_join_leave=no
; Callee is kicked when the last marked user (caller) leaves.
end_marked=yes

[sv_caller]
type=user
dtmf_passthrough=yes
announce_join_leave=no
; Caller is the marked user — leaving ends the conference for end_marked peers.
marked=yes
end_marked=yes

[sv_bridge]
type=bridge
max_members=3
