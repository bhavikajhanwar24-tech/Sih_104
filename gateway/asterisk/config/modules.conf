; =============================================================================
; Module load list — PJSIP + ARI + dialplan essentials for the lab PBX
; =============================================================================

[modules]
autoload=yes

; Prefer PJSIP; keep chan_sip off if present in the image.
noload => chan_sip.so

; Docker Desktop NAT: native_rtp skips Asterisk's media relay and yields
; "packets TX/RX but silence". Force simple_bridge so Asterisk proxies RTP.
noload => bridge_native_rtp.so

; Ensure the pieces we rely on are present (harmless if already autoloaded).
load => res_http_websocket.so
load => res_ari.so
load => res_ari_asterisk.so
load => res_ari_channels.so
load => res_ari_bridges.so
load => res_ari_endpoints.so
load => res_ari_events.so
load => res_manager.so
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_registrar.so
load => chan_pjsip.so
; F10 — PJSIP REALTIME from PostgreSQL (schema asterisk)
load => res_config_pgsql.so
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_realtime.so
load => app_dial.so
load => app_echo.so
load => app_playback.so
load => app_stack.so
load => app_confbridge.so
load => app_originate.so
load => res_agi.so
load => res_curl.so
; AudioSocket lands in P7.2 — preload so the TODO seam works without a rebuild.
load => app_audiosocket.so
load => res_mutestream.so
load => res_rtp_asterisk.so
load => res_timing_timerfd.so
load => codec_ulaw.so
load => codec_alaw.so
load => codec_resample.so
load => format_pcm.so
load => format_wav.so
