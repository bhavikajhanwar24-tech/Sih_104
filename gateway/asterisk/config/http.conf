; =============================================================================
; HTTP server for ARI — P7.1 / P7.3
; Container binds all interfaces; docker-compose publishes 127.0.0.1:8088 only
; so ARI is still localhost-only on the Docker host (Windows/Mac Desktop safe).
; On Linux + network_mode:host, set bindaddr=127.0.0.1 instead.
; =============================================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
prefix=
sessionlimit=100
session_inactivity=30000
session_keep_alive=15000
