; =============================================================================
; Verbose console logging — SIP debugging without logs is misery.
; =============================================================================

[general]
dateformat=%F %T
queue_log=no
rotatestrategy=rotate

[logfiles]
; Console: errors + warnings + notices + verbose + debug (dialplan / PJSIP)
console => notice,warning,error,verbose,debug
; Also keep a rotating full log inside the container for post-mortems.
full => notice,warning,error,verbose,debug
messages => notice,warning,error
