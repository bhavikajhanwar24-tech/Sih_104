; =============================================================================
; SentinelVoice dialplan — [sentinel] context (Context §11.3 / P7.1)
; Softphones register as caller (1001) / agent (1002). Dialling 1002 rings agent.
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[sentinel]
; --- Ring the agent (1002) from the caller softphone ---------------------------
exten => 1002,1,NoOp(SentinelVoice: caller → agent 1002)
 same => n,Set(SV_SESSION=${UNIQUEID})
 ;
 ; TODO(P7.2): Insert the AudioSocket media tap HERE so RTP is forked into
 ;             ml-engine before/while the agent leg is bridged.
 ;             Seam from Context §11.3 (drop this in when the bridge listens on :9092):
 ;
 ;               same => n,Dial(PJSIP/agent,60,U(tap))
 ;               same => n,Hangup()
 ;
 ;             with a local subroutine:
 ;
 ;               [tap]
 ;               exten => s,1,AudioSocket(${SV_SESSION},127.0.0.1:9092)
 ;                same => n,Return()
 ;
 ;             Until P7.2 lands, dial the agent directly (no tap):
 same => n,Dial(PJSIP/agent,60)
 same => n,Hangup()

; --- Optional: ring the caller (1001) from the agent softphone ----------------
exten => 1001,1,NoOp(SentinelVoice: agent → caller 1001)
 same => n,Dial(PJSIP/caller,60)
 same => n,Hangup()

; --- Echo test (no second softphone required) — used by scripts/test-sip-call.sh
exten => 9196,1,NoOp(SentinelVoice: echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- Quick dial-by-username aliases -------------------------------------------
exten => caller,1,Goto(1001,1)
exten => agent,1,Goto(1002,1)
