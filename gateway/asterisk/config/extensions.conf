; =============================================================================
; SentinelVoice dialplan — [sentinel] context (Context §11.3 / P7.1 + P7.2)
; Softphones register as caller (1001) / agent (1002). Dialling 1002 rings agent
; and taps media to the AudioSocket bridge (host.docker.internal:9092).
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[sentinel]
; --- Caller → agent (1002) with non-destructive AudioSocket tap ---------------
; Answer, allocate a wire-protocol UUID (UNIQUEID is NOT a UUID), Dial agent.
;
; Pre-dial `b(sentinel-tap^s^1)` returns immediately. Putting AudioSocket()
; itself in `b()`/`U()` would block before the caller↔agent bridge forms —
; a tap that degrades two-way audio is worse than no tap.
;
; The Python bridge (gateway/asterisk_bridge.py) uses ARI to snoop the bridged
; call and `continue`s the snoop channel into [sentinel-snoop], which runs
; AudioSocket → host.docker.internal:9092 (Docker Desktop). On Linux host
; networking, change that host to 127.0.0.1.
exten => 1002,1,Answer()
 same => n,Set(SV_SESSION=${UUID()})
 same => n,Set(__SV_SESSION=${SV_SESSION})
 same => n,Dial(PJSIP/agent,60,b(sentinel-tap^s^1))
 same => n,Hangup()

; --- Optional: agent → caller -------------------------------------------------
exten => 1001,1,NoOp(SentinelVoice: agent → caller 1001)
 same => n,Dial(PJSIP/caller,60)
 same => n,Hangup()

; --- Echo test ----------------------------------------------------------------
exten => 9196,1,NoOp(SentinelVoice: echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => caller,1,Goto(1001,1)
exten => agent,1,Goto(1002,1)

; --- P7.2 pre-dial: mark call for ARI snoop (must not block Dial) -------------
[sentinel-tap]
exten => s,1,NoOp(SentinelVoice: tap armed SV_SESSION=${SV_SESSION})
 same => n,Return()

; --- AudioSocket on an ARI snoop channel (media copy, not the agent path) -----
[sentinel-snoop]
exten => s,1,NoOp(SentinelVoice: AudioSocket SV_SESSION=${SV_SESSION})
 same => n,AudioSocket(${SV_SESSION},host.docker.internal:9092)
 same => n,Hangup()
