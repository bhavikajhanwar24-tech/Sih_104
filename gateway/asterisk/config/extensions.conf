; =============================================================================
; SentinelVoice dialplan — [sentinel] context (Context §11.3 / P7.1 + P7.2)
; Softphones register as caller (1001) / agent (1002). Dialling 1002 rings agent
; and taps media to the AudioSocket bridge (host.docker.internal:9092).
;
; Caller↔agent uses ConfBridge (not Dial) so L4 hold can silence both legs with
; `confbridge mute <conf> all` without tearing the call down.
; Conference name is deterministic: sv + SV_SESSION hex (dashes stripped).
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[sentinel]
; --- Caller → agent (1002) via ConfBridge + AudioSocket tap -------------------
; Answer, allocate wire-protocol UUID, async-originate agent into same conf,
; then caller joins ConfBridge. ARI snoop (bridge) still taps PJSIP/caller.
exten => 1002,1,Answer()
 same => n,Set(SV_SESSION=${UUID()})
 same => n,Set(__SV_SESSION=${SV_SESSION})
 same => n,Set(CONF=sv${FILTER(0-9a-fA-F,${SV_SESSION})})
 same => n,Set(__CONF=${CONF})
 same => n,Originate(PJSIP/agent,exten,sentinel,${CONF},1,60,av(SV_SESSION=${SV_SESSION}^__SV_SESSION=${SV_SESSION}^CONF=${CONF}))
 same => n,NoOp(SentinelVoice: caller join conf=${CONF} originate=${ORIGINATE_STATUS})
 same => n,ConfBridge(${CONF})
 same => n,Hangup()

; --- Agent leg joins conference named by extension (sv + session hex) ---------
exten => _sv.,1,NoOp(SentinelVoice: agent join conf=${EXTEN} sid=${SV_SESSION})
 same => n,Answer()
 same => n,Set(CONF=${EXTEN})
 same => n,ConfBridge(${EXTEN})
 same => n,Hangup()

; --- Optional: agent → caller -------------------------------------------------
exten => 1001,1,NoOp(SentinelVoice: agent → caller 1001)
 same => n,Set(SV_SESSION=${UUID()})
 same => n,Set(__SV_SESSION=${SV_SESSION})
 same => n,Set(CONF=sv${FILTER(0-9a-fA-F,${SV_SESSION})})
 same => n,Set(__CONF=${CONF})
 same => n,Originate(PJSIP/caller,exten,sentinel,${CONF},1,60,av(SV_SESSION=${SV_SESSION}^__SV_SESSION=${SV_SESSION}^CONF=${CONF}))
 same => n,ConfBridge(${CONF})
 same => n,Hangup()

; --- Echo test ----------------------------------------------------------------
exten => 9196,1,NoOp(SentinelVoice: echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => caller,1,Goto(1001,1)
exten => agent,1,Goto(1002,1)

; --- AudioSocket on an ARI snoop channel (media copy, not the talk path) ------
[sentinel-snoop]
exten => s,1,NoOp(SentinelVoice: AudioSocket SV_SESSION=${SV_SESSION})
 same => n,AudioSocket(${SV_SESSION},host.docker.internal:9092)
 same => n,Hangup()

; --- Legacy redirect target (unused by ConfBridge hold; kept for safety) ------
[sentinel-held]
exten => s,1,NoOp(SentinelVoice: CALL HELD)
 same => n,Answer()
 same => n,Playback(sentinel-hold)
 same => n,Wait(600)
 same => n,Hangup()
