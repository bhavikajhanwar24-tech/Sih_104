; =============================================================================
; SentinelVoice dialplan — multi-tenant (F10)
; Softphones register via PJSIP REALTIME. Dialled digits hit AGI which CURL
; Java internal APIs, then ConfBridge + Originate(PJSIP/${DEST_ENDPOINT},...).
; [sentinel-snoop] AudioSocket unchanged for media tap.
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[sentinel]
; Generic extension pattern — AGI sets CONF, DEST_ENDPOINT, SV_SESSION
exten => _X.,1,NoOp(SentinelVoice: dial ${EXTEN} from ${CHANNEL(endpoint)})
 ; Keep caller in early media until callee answers — Answer() before Originate
 ; made Zoiper show "in call" while the far end never rang / returned 486.
 same => n,Progress()
 same => n,AGI(/var/lib/asterisk/agi-bin/sv_call_agi.py,${EXTEN},${CHANNEL(endpoint)},${CALLERID(num)},${CHANNEL(pjsip,call-id)})
 same => n,GotoIf($["${DEST_ENDPOINT}" = ""]?fail)
 same => n,GotoIf($["${AGI_STATUS}" = "FAILED"]?fail)
 same => n,Set(__SV_SESSION=${SV_SESSION})
 same => n,Set(__CONF=${CONF})
 ; Outbound INVITE From must be the caller endpoint. Empty/unknown CID makes
 ; some Zoiper builds answer 486 Busy Here (phone silent; laptop→phone fails).
 same => n,Set(CALLERID(num)=${CHANNEL(endpoint)})
 same => n,Set(CALLERID(name)=${CHANNEL(endpoint)})
 ; Ensure hangup finalizes DB + kicks peer out of ConfBridge
 same => n,Set(CHANNEL(hangup_handler_push)=sentinel-hh,s,1)
 same => n,Originate(PJSIP/${DEST_ENDPOINT},exten,sentinel,${CONF},1,60,av(SV_SESSION=${SV_SESSION}^__SV_SESSION=${SV_SESSION}^CONF=${CONF}^CALLERID(num)=${CALLERID(num)}^CALLERID(name)=${CALLERID(name)}))
 same => n,NoOp(SentinelVoice: join conf=${CONF} dest=${DEST_ENDPOINT} originate=${ORIGINATE_STATUS})
 same => n,GotoIf($["${ORIGINATE_STATUS}" != "SUCCESS"]?noanswer)
 same => n,Answer()
 same => n,ConfBridge(${CONF},sv_bridge,sv_caller)
 same => n,Hangup()
 same => n(noanswer),NoOp(SentinelVoice: callee did not answer / originate=${ORIGINATE_STATUS})
 same => n,TrySystem(/var/lib/asterisk/agi-bin/sv_session_end.sh ${SV_SESSION} NO_ANSWER)
 same => n,Hangup()
 same => n(fail),NoOp(SentinelVoice: resolve/start failed for ${EXTEN})
 same => n,TrySystem(/var/lib/asterisk/agi-bin/sv_session_end.sh ${SV_SESSION} FAILED)
 same => n,Busy(5)
 same => n,Hangup()

; Callee leg joins conference named by extension (sv + session hex)
exten => _sv.,1,NoOp(SentinelVoice: callee join conf=${EXTEN} sid=${SV_SESSION})
 same => n,Answer()
 same => n,Set(CONF=${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=sentinel-hh,s,1)
 same => n,ConfBridge(${EXTEN},sv_bridge,sv_user)
 same => n,Hangup()

; Echo test
exten => 9196,1,NoOp(SentinelVoice: echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- Hangup handler: kick remaining ConfBridge members + finalize call_sessions
; Prefer curl script over AGI — AGI often fails while the channel is tearing down,
; which left Live Calls rows stuck with ended_at NULL.
[sentinel-hh]
exten => s,1,NoOp(SentinelVoice HH conf=${CONF} sid=${SV_SESSION})
 same => n,GotoIf($["${CONF}" = ""]?endagi)
 same => n,TrySystem(asterisk -rx "confbridge kick ${CONF} all")
 same => n(endagi),GotoIf($["${SV_SESSION}" = ""]?ret)
 same => n,TrySystem(/var/lib/asterisk/agi-bin/sv_session_end.sh ${SV_SESSION} ENDED)
 same => n(ret),Return()

; --- AudioSocket on an ARI snoop channel (media copy, not the talk path) ------
[sentinel-snoop]
exten => s,1,NoOp(SentinelVoice: AudioSocket SV_SESSION=${SV_SESSION})
 same => n,AudioSocket(${SV_SESSION},host.docker.internal:9092)
 same => n,Hangup()

; --- Legacy redirect target (unused by ConfBridge hold; kept for safety) ------
[sentinel-held]
exten => s,1,NoOp(SentinelVoice: CALL HELD)
 same => n,Answer()
 same => n,Playback(sentinel-hold)
 same => n,Wait(600)
 same => n,Hangup()
