# SentinelVoice — four-plane stack + PostgreSQL 16
#
# Full demo: make demo  (preflight → compose up --build → seed scenarios)
# Host-only planes:   scripts/run_all.sh  or  .\make.cmd dev
#
# Copy .env.example → .env before `docker compose up`.

services:
  # Optional offline companion. Deployed / shared central DB is Supabase
  # (set DB_URL in .env — docs/v2/SUPABASE.md). Backend does not require this
  # service when JDBC points at the Session Pooler.
  postgres:
    image: postgres:16
    container_name: sentinelvoice-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelvoice}
      POSTGRES_USER: ${POSTGRES_USER:-sv_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_bootstrap}
      SV_OWNER_PASSWORD: ${SV_OWNER_PASSWORD:-changeme_owner}
      SV_APP_PASSWORD: ${SV_APP_PASSWORD:-changeme_app}
    ports:
      # Host 15432 — avoid local Postgres on 5432/5433 and Windows reserved ranges.
      - "127.0.0.1:15432:5432"
    volumes:
      - sv_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  asterisk:
    build: ./gateway/asterisk
    container_name: sentinelvoice-asterisk
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:5038:5038"
      - "5060:5060/udp"
      - "10000-10020:10000-10020/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SIP_EXTERNAL_IP: ${SIP_EXTERNAL_IP:-}
      SIP_LOCAL_NET: ${SIP_LOCAL_NET:-127.0.0.1/32}
      # Prefer compose-network Postgres; override for Supabase Session Pooler.
      ASTERISK_DB_HOST: ${ASTERISK_DB_HOST:-postgres}
      ASTERISK_DB_PORT: ${ASTERISK_DB_PORT:-5432}
      ASTERISK_DB_NAME: ${ASTERISK_DB_NAME:-${POSTGRES_DB:-sentinelvoice}}
      ASTERISK_DB_USER: ${ASTERISK_DB_USER:-sv_asterisk}
      ASTERISK_DB_PASSWORD: ${ASTERISK_DB_PASSWORD:-changeme_asterisk}
      # Supabase requires TLS; harmless for local Docker Postgres.
      PGSSLMODE: ${PGSSLMODE:-prefer}
      SV_BACKEND_URL: ${SV_BACKEND_URL:-http://backend:8081}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./gateway/asterisk/config:/opt/sentinelvoice/asterisk-config:ro
      - ./gateway/asterisk/scripts:/opt/sentinelvoice/scripts:ro
      - ./gateway/asterisk/sounds/sentinel-hold.wav:/var/lib/asterisk/sounds/sentinel-hold.wav:ro
      - ./gateway/asterisk/sounds/sentinel-whisper-warning.wav:/var/lib/asterisk/sounds/sentinel-whisper-warning.wav:ro
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelvoice-backend
    restart: unless-stopped
    depends_on:
      asterisk:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SENTINELVOICE_ML_BASE_URL: http://ml-engine:8000
      SENTINELVOICE_ML_WEBSOCKET_URL: ws://ml-engine:8000/ingest
      SENTINELVOICE_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      # Prefer .env DB_* (Supabase Session Pooler for central DB). Local compose
      # fallback only when USE_SUPABASE is not true.
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinelvoice}}
      DB_APP_USER: ${DB_APP_USER:-sv_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-changeme_app}
      DB_OWNER_USER: ${DB_OWNER_USER:-sv_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-changeme_owner}
      SERVER_PORT: "8081"
      LAB_MODE: ${LAB_MODE:-false}
      SIP_EXTERNAL_IP: ${SIP_EXTERNAL_IP:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  ml-engine:
    build: ./ml-engine
    container_name: sentinelvoice-ml-engine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SENTINELVOICE_ML_JAVA_INGEST_WS: ws://backend:8081/ws/features
      SENTINELVOICE_ML_JAVA_DECISION_HTTP: http://backend:8081
      SENTINELVOICE_ML_JAVA_PASSPORT_URL: http://backend:8081/api/v1/passport/register
      # Host Ollama (Windows/Mac Docker Desktop). Override if Ollama is a compose service.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      LLM_GATEWAY_CONCURRENCY: ${LLM_GATEWAY_CONCURRENCY:-1}
      LLM_FORCE_MOCK: ${LLM_FORCE_MOCK:-false}
      SENTINELVOICE_ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
    volumes:
      - ./ml-engine/models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  frontend:
    build: ./frontend
    container_name: sentinelvoice-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional in-compose Ollama (F5). Prefer a host-installed model (gemma3:4b) via
  # OLLAMA_BASE_URL=http://host.docker.internal:11434 on ml-engine.
  # Start: docker compose --profile llm up -d ollama
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: sentinelvoice-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - sv_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  sv_pgdata:
  sv_ollama:
