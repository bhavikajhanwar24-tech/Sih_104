# SentinelVoice — four-plane stack
#
# Media plane (Asterisk) is containerized below.
# Inference (ml-engine), Decision (backend), and Presentation (frontend) run on the
# HOST via `.\make.cmd dev` — they have no production-ready Dockerfiles yet.
# Do not add stub containers that look like they work; start those planes with Make.

services:
  asterisk:
    # P7.1 — Asterisk 20 LTS + caller/agent SIP + ARI (Context §11.3)
    build: ./gateway/asterisk
    container_name: sentinelvoice-asterisk
    restart: unless-stopped
    # Docker Desktop (Windows/Mac): host networking does NOT attach to the Windows
    # localhost namespace — SIP/ARI on 127.0.0.1 look "up" in logs but are unreachable
    # from softphones/curl on the host. Use published ports instead.
    #
    # Linux venue laptop: you may switch to `network_mode: host` and remove `ports:`
    # (then ARI stays on 127.0.0.1 inside http.conf).
    ports:
      - "127.0.0.1:8088:8088"           # ARI (localhost only on the host)
      # AMI :5038 is NOT published — Docker Desktop TCP proxy wedges Manager
      # (host connects, no banner). Hold uses docker exec → in-container AMI MuteAudio.
      - "5060:5060/udp"                 # SIP
      - "10000-10020:10000-10020/udp"   # RTP (narrow map for Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount lab configs so the image cannot reset http bindaddr to 127.0.0.1
      - ./gateway/asterisk/config/http.conf:/etc/asterisk/http.conf:ro
      - ./gateway/asterisk/config/ari.conf:/etc/asterisk/ari.conf:ro
      - ./gateway/asterisk/config/manager.conf:/etc/asterisk/manager.conf:ro
      - ./gateway/asterisk/config/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./gateway/asterisk/config/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./gateway/asterisk/config/modules.conf:/etc/asterisk/modules.conf:ro
      - ./gateway/asterisk/config/logger.conf:/etc/asterisk/logger.conf:ro
      - ./gateway/asterisk/config/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./gateway/asterisk/scripts/ami_mute.py:/opt/sentinelvoice/ami_mute.py:ro
      - ./gateway/asterisk/sounds/sentinel-hold.wav:/var/lib/asterisk/sounds/sentinel-hold.wav:ro
      - ./gateway/asterisk/sounds/sentinel-whisper-warning.wav:/var/lib/asterisk/sounds/sentinel-whisper-warning.wav:ro
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Configs are also baked into the image; mounts win for live edits.

  # Intentionally omitted until Dockerfiles exist:
  #   ml-engine  → .\make.cmd ml      (host :8000)
  #   backend    → .\make.cmd backend (host :8080)
  #   frontend   → .\make.cmd frontend (host :5173)
  # Full stack: .\make.cmd dev  (starts asterisk via compose, then host planes)
