# SentinelVoice — four-plane stack (Media + Inference + Decision + Presentation)
#
# Full demo: make demo  (preflight → compose up --build → seed scenarios)
# Host-only planes:   scripts/run_all.sh  or  .\make.cmd dev

services:
  asterisk:
    build: ./gateway/asterisk
    container_name: sentinelvoice-asterisk
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
      - "5060:5060/udp"
      - "10000-10020:10000-10020/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway/asterisk/config/http.conf:/etc/asterisk/http.conf:ro
      - ./gateway/asterisk/config/ari.conf:/etc/asterisk/ari.conf:ro
      - ./gateway/asterisk/config/manager.conf:/etc/asterisk/manager.conf:ro
      - ./gateway/asterisk/config/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./gateway/asterisk/config/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./gateway/asterisk/config/modules.conf:/etc/asterisk/modules.conf:ro
      - ./gateway/asterisk/config/logger.conf:/etc/asterisk/logger.conf:ro
      - ./gateway/asterisk/config/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./gateway/asterisk/scripts/ami_mute.py:/opt/sentinelvoice/ami_mute.py:ro
      - ./gateway/asterisk/sounds/sentinel-hold.wav:/var/lib/asterisk/sounds/sentinel-hold.wav:ro
      - ./gateway/asterisk/sounds/sentinel-whisper-warning.wav:/var/lib/asterisk/sounds/sentinel-whisper-warning.wav:ro
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelvoice-backend
    restart: unless-stopped
    depends_on:
      asterisk:
        condition: service_healthy
    environment:
      SENTINELVOICE_ML_BASE_URL: http://ml-engine:8000
      SENTINELVOICE_ML_WEBSOCKET_URL: ws://ml-engine:8000/ingest
      SENTINELVOICE_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  ml-engine:
    build: ./ml-engine
    container_name: sentinelvoice-ml-engine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SENTINELVOICE_ML_JAVA_INGEST_WS: ws://backend:8080/ws/features
      SENTINELVOICE_ML_JAVA_DECISION_HTTP: http://backend:8080
      SENTINELVOICE_ML_JAVA_PASSPORT_URL: http://backend:8080/api/v1/passport/register
    volumes:
      - ./ml-engine/models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  frontend:
    build: ./frontend
    container_name: sentinelvoice-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: docker compose --profile postgres up
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: sentinelvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelvoice}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
